# New year: the notice in the sidebar of every page reads "(c) 2024-<year of the build>"
# (README.md, License), so a site built in December keeps the old year until it is built
# again. At the start of every year this workflow rebuilds the published sites, with no
# commit (the owner's instruction of 2026-11-25, CLAUDE.md Section 2).
#
# How, from the documentation of GitHub
# (https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#schedule):
# - "Scheduled workflows will only run on the default branch": this file works once it is on
#   master, and its run has the ref of master. The environment github-pages accepts
#   deployments from stage only, so this workflow does not deploy: it starts stage.yml on
#   stage, by workflow_dispatch, one of the events that the GITHUB_TOKEN may trigger.
# - The schedule runs in UTC, as the build does: at 00:17 UTC of 1 January the year of the
#   build is already the new one. "High load times include the start of every hour", and
#   then "some queued jobs may be dropped": hence minute 17, and a second run at noon.
# - "In a public repository, scheduled workflows are automatically disabled when no
#   repository activity has occurred in 60 days" (CLAUDE.md, Section 12).
name: New year

on:
  schedule:
    - cron: "17 0 1 1 *"
    - cron: "17 12 1 1 *"
  workflow_dispatch:

permissions:
  actions: write   # to start stage.yml

jobs:
  rebuild:
    runs-on: ubuntu-24.04
    steps:
      - name: Rebuild the stage site (stage.yml on stage)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stage.yml --repo "$GITHUB_REPOSITORY" --ref stage

      # TODO: rebuild production too (master, theplanet.observer) once its deploy exists
      # (issue #2): until then nothing deploys master, so there is nothing to start here.
