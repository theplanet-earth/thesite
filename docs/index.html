---
layout: default
title: Home
---
<section class="globe-section" aria-labelledby="globe-title">
  <div class="glob_coverage">
    <h1 id="globe-title">Global coverage</h1>
  </div>
  <!-- The globe (src/globe/, bundled into /assets/bundle/globe.js): the land mask comes from
       scripts/land-mask.py, the places from _data/coverage.yml. -->
  <div class="globe" data-globe data-land="{{ '/assets/globe/land.png' | relative_url }}"
       data-label="A globe of the Earth, with the land drawn as dots and the covered places as orange rings. Drag it, or use the arrow keys, to turn it.">
    <div class="globe-placeholder" aria-hidden="true"></div>
    <p class="globe-fallback">The globe needs WebGL, which this browser does not offer.</p>
  </div>
  <p class="globe-credits">
    The globe follows the techniques described in
    <a href="https://github.blog/engineering/engineering-principles/how-we-built-the-github-globe/">How we built the GitHub globe</a>
    by Tobias Ahlin (GitHub, 2020), rebuilt with <a href="https://threejs.org/">three.js</a>
    (<a href="{{ '/assets/bundle/three.LICENSE.txt' | relative_url }}">MIT licence</a>).
    Land: <a href="https://www.naturalearthdata.com/">Natural Earth</a>, public domain.
  </p>
</section>
<script type="application/json" id="coverage">{{ site.data.coverage | jsonify }}</script>
<script type="module" src="{{ '/assets/bundle/globe.js' | relative_url }}"></script>
