<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: site.description | strip_html | escape }}">

  <title>
    {% if page.title == "Home" %}
      {{ site.title }} &middot; {{ site.tagline }}
    {% else %}
      {{ page.title }} &middot; {{ site.title }}
    {% endif %}
  </title>

  <!-- Every local link goes through relative_url: the build passes an empty baseurl, with
       which a plain public/... would be relative to the page (CLAUDE.md, Section 12). -->

  <!-- The Hyde theme on Poole (MIT, public/LICENSE.md), with the dark colours of the project. -->
  <link rel="stylesheet" href="{{ '/public/css/poole.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/syntax.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/public/css/hyde.css' | relative_url }}">

  <!-- Fonts, as the prototype loads them (over https): PT Sans and Abril Fatface of the theme,
       Roboto Mono for the logotype of the sidebar. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=PT+Sans:400,400italic,700|Abril+Fatface">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&display=swap">

  <!-- The project's own styles. -->
  <!-- ?v= changes at every build, so that no browser keeps older styles. -->
  <link rel="stylesheet" href="{{ '/assets/css/theplanet.css' | relative_url }}?v={{ site.time | date: '%s' }}">
  <link rel="stylesheet" href="{{ '/assets/css/globe.css' | relative_url }}?v={{ site.time | date: '%s' }}">

  <link rel="apple-touch-icon" sizes="144x144" href="{{ '/public/apple-touch-icon.png' | relative_url }}">
  <link rel="icon" href="{{ '/public/favicon.ico' | relative_url }}">
</head>
