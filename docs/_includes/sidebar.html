<div class="sidebar">
  <div class="container">
    <div class="sidebar-about roboto-mono-sidebar">
      <a href="{{ '/' | relative_url }}" class="sidebar-logo">
        <img src="{{ '/assets/images/theplanet.png' | relative_url }}" alt="The mascot of the project: the Earth walking, with a cap and sunglasses">
        <h1>THE<br>PLA<br>NET</h1>
      </a>
    </div>

    <nav class="sidebar-nav" aria-label="Pages">
      {%- assign home = '/' | relative_url %}
      <a class="sidebar-nav-item{% if page.url == '/' %} active{% endif %}" href="{{ home }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
      {%- for node in site.pages %}
        {%- if node.layout == "page" and node.title %}
      <a class="sidebar-nav-item{% if page.url == node.url %} active{% endif %}" href="{{ node.url | relative_url }}"{% if page.url == node.url %} aria-current="page"{% endif %}>{{ node.title }}</a>
        {%- endif %}
      {%- endfor %}
      <a class="sidebar-nav-item" href="{{ site.github.repo }}">Source on GitHub</a>
    </nav>

    <!-- TODO: "All rights reserved" against the Apache License 2.0 of the repository is
         reported to the owner (CLAUDE.md, Section 12), not changed here. -->
    <p>&copy; {{ site.time | date: '%Y' }}. All rights reserved.</p>
  </div>
</div>
