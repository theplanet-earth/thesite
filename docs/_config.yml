# The site of the organization theplanet-earth (README.md). scripts/build.sh builds it with
# an empty baseurl, for the domain root of both environments (CLAUDE.md, Section 1); every
# local link goes through relative_url.
title: The Planet
tagline: Earth
description: >-
  The project site of theplanet.earth: a globe of the Earth with the latest edits to
  OpenStreetMap.

permalink: pretty

# The holder of the copyright, in the notice of the sidebar (README.md, License).
author: Andrea Gallegati

github:
  repo: https://github.com/theplanet-earth/thesite

# The tiles of the page Map (src/globe/map.js): the Standard tiles of OpenStreetMap, at the URL
# their tile usage policy asks for (https://operations.osmfoundation.org/policies/tiles/), kept
# here rather than in the code, as the policy recommends.
map:
  tiles: https://tile.openstreetmap.org/{z}/{x}/{y}.png
